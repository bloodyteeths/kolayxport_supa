slug: etsy-ilan-olusturma
order: 14
title: "Etsy'de yapay zekâyla yeni ilan oluşturun"
description: "Ürün fotoğrafınızı ekleyin; yapay zekâ fotoğrafa bakıp başlığı, açıklamayı ve etiketleri yazsın, ek fotoğraf oluşturun, ilanı taslak kaydedin."
keyword: "etsy ilan nasıl oluşturulur"
inventoryRefs: [etsy-listing-editor, ai-listing-copy, ai-image-gen, staged-drafts-send]
tags: [etsy, etsy ilan oluşturma, yapay zeka, etsy başlık, etsy etiket]
startUrl: /app/etsy-listings/new
ready: { testid: le-ai-fill-run }
reseed: true            # the new listing is saved as a local draft
mocks:
  - use: etsy-create
  - use: etsy-editor
steps:
  - say: "Merhaba! Bu videoda Etsy'de yeni bir ilanı, ürün fotoğrafınızdan yola çıkarak yapay zekâyla oluşturacağız."
  - title: "Ürün fotoğrafınızı ekleyin"
    say: "Etsy › Yeni ilan sayfasında önce ürün fotoğrafınızı ekleyin. İlk fotoğraf, ilanın ana fotoğrafı olur."
    do:
      - hover: { role: button, name: "Fotoğraf seçin" }
      - upload: { selector: "input[type=file][accept*='image'] >> nth=0", file: public/demo/iznik-bowl-photo.jpg }
      - waitFor: { selector: "[data-testid=le-section-photos] img" }
      - waitFor: { text: "Fotoğraflardan doldur" }
    zoom: { testid: le-section-photos, scale: 1.3 }
  - title: "Fotoğraflardan doldurun"
    say: "Hızlı başlayın kartında Fotoğraflardan doldur'a tıklayın. Yapay zekâ fotoğrafınıza bakıp ürünü tanır, sonra başlığı, açıklamayı ve etiketleri yazar."
    do:
      - click: { testid: le-ai-fill-run }
      - waitFor: { testid: le-ai-fill-progress }
    zoom: { testid: le-ai-fill-card, scale: 1.35 }
  - title: "Başlığa bakın"
    say: "Başlık, alıcıların Etsy'de aradığı kelimelerle İngilizce yazılır: kelimelerin baş harfi büyük, ayraç olarak yalnızca virgül var."
    do:
      - waitFor: { testid: le-ai-fill-use-all }
      - scrollTo: { testid: le-title-suggestion }
    zoom: { testid: le-title-suggestion, scale: 1.3 }
  - title: "Açıklamayı okuyun"
    say: "Açıklamayı okuyun. Ürününüze uymayan bir şey varsa öneriyi kullandıktan sonra düzeltebilirsiniz."
    do:
      - scrollTo: { testid: le-description-suggestion }
    zoom: { testid: le-description-suggestion, scale: 1.2 }
  - title: "Etiketlere bakın"
    say: "Etiketler de hazır; her biri en fazla yirmi karakter."
    do:
      - scrollTo: { testid: le-section-tags }
    zoom: { testid: le-section-tags, scale: 1.25 }
  - title: "Hepsini kullanın"
    say: "Beğendiyseniz Hepsini kullan'a tıklayın. Öneriler alanlara yerleşir; her alanı siz onaylarsınız."
    do:
      - scrollTo: { testid: le-ai-fill-use-all }
      - click: { testid: le-ai-fill-use-all }
      - wait: 800
      - scrollTo: { testid: le-section-title }
    zoom: { testid: le-section-title, scale: 1.25 }
  - title: "Ek fotoğraf oluşturun"
    say: "Şimdi Fotoğraf oluştur'a tıklayın, sahneyi yazın ve eklediğiniz fotoğrafı referans seçin. Yapay zekâ ürününüzü bu fotoğraftan örnek alır."
    do:
      - scrollTo: { testid: le-section-photos }
      - click: { role: button, name: "Fotoğraf oluştur" }
      - waitFor: { role: dialog }
      - fill: { placeholder: "örnek: Professional", value: "The same bowl filled with fresh figs on a rustic dining table, soft daylight" }
      - click: { selector: "[role=dialog] img >> nth=0" }
      - wait: 500
      - click: { role: button, name: "Görsel Oluştur" }
      - waitFor: { role: button, name: "Kabul Et ve Yükle" }
      - scrollTo: { role: button, name: "Kabul Et ve Yükle" }
    zoom: { selector: "[role=dialog] img >> nth=-1", scale: 1.25 }
  - title: "Fotoğrafı ilana ekleyin"
    say: "Ürün aynı kalır, yalnızca sahne değişir. Beğendiğinizde Kabul Et ve Yükle deyin; fotoğraf ilanın taslağına eklenir."
    do:
      - click: { role: button, name: "Kabul Et ve Yükle" }
      - waitFor: { selector: "[data-testid=le-section-photos] img >> nth=1" }
    zoom: { testid: le-section-photos, scale: 1.3 }
  - title: "Fiyat, stok ve kargoyu kontrol edin"
    say: "Fiyatı ve stok adedini girin, kargo profilinizi seçin."
    do:
      - fill: { selector: "[data-testid=le-price-input] input, input[data-testid=le-price-input]", value: "48" }
      - fill: { selector: "[data-testid=le-quantity-input] input, input[data-testid=le-quantity-input]", value: "10" }
      - click: { selector: "#le-field-shipping_profile_id" }
      - click: { role: option, name: "Worldwide from Istanbul" }
    zoom: { testid: le-section-shipping, scale: 1.25 }
  - title: "Taslak olarak saklayın"
    say: "İlanınız KolayXport'ta taslak olarak kaydedilir. Siz Etsy'de yayınla demeden Etsy'ye hiçbir şey gitmez."
    do:
      - hover: { testid: le-primary }
    zoom: { testid: le-footer, scale: 1.4 }
  - say: "Takıldığınız yerde Yardım sayfasından bize yazabilirsiniz. KolayXport'u 14 gün ücretsiz deneyebilirsiniz."
