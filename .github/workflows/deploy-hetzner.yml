name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KOLAYXPORT_VPS_IP }}
          username: deploy
          key: ${{ secrets.KOLAYXPORT_SSH_KEY }}
          # Next.js build can run ~10 minutes on this VPS; default action timeout is 10m
          # which has killed past deploys mid-build (verified Sprint 5 close).
          command_timeout: 20m
          script: |
            cd /home/deploy/kolayxport
            git pull origin main
            npm install --legacy-peer-deps
            # Apply any pending Prisma migrations BEFORE generating the client. `migrate deploy`
            # is the only Prisma command allowed in production — it applies migrations from
            # prisma/migrations/* and exits non-zero on failure. NEVER run `prisma db push`
            # or `prisma db push --accept-data-loss` here.
            npx prisma migrate deploy
            npx prisma generate
            cp -r .next .next-backup 2>/dev/null || true
            rm -rf .next
            npx next build --webpack || { echo "Build failed, restoring backup"; cp -r .next-backup .next; exit 1; }
            sudo systemctl restart kolayxport
            sleep 5
            curl -fsS https://kolayxport.com/api/health || { echo "Health check failed, restoring backup"; rm -rf .next; cp -r .next-backup .next; sudo systemctl restart kolayxport; exit 1; }
            rm -rf .next-backup
