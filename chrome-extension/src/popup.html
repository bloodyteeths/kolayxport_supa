<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KolayXport</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="../icons/icon-32.png" alt="KolayXport" class="logo">
      <h1>KolayXport</h1>
      <span id="authBadge" class="auth-badge checking">●</span>
    </header>

    <div class="card">
      <div class="setting-row">
        <span data-i18n="status">Durum</span>
        <span id="authStatus" class="status-badge checking" data-i18n="checking">Kontrol ediliyor...</span>
      </div>
      <div class="setting-row" id="userRow" style="display:none;">
        <span data-i18n="user">Kullanıcı</span>
        <span id="userEmail" class="text-muted">—</span>
      </div>
    </div>

    <div class="card" id="researchCard" style="display:none;">
      <h3 class="card-title" data-i18n="researchTitle">Araştırma</h3>
      <div class="setting-row">
        <span id="researchUsage" class="text-muted">—</span>
      </div>
      <div id="researchLimit" style="margin-top:6px;display:none;"></div>
    </div>

    <div class="card">
      <h3 class="card-title" data-i18n="overlayTitle">Araştırma Panelleri</h3>
      <div class="setting-row">
        <span data-i18n="allOverlays">Tüm paneller</span>
        <label class="toggle"><input type="checkbox" id="toggleOverlays" checked><span class="slider"></span></label>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">Dil / Language</h3>
      <div class="setting-row">
        <select id="langSelect" class="lang-select" aria-label="Dil / Language">
          <option value="auto" data-i18n="langAuto">Otomatik</option>
          <option value="tr">Türkçe</option>
          <option value="en">English</option>
        </select>
      </div>
      <div id="langHint" class="text-muted lang-hint" data-i18n="langHintAuto">Hesap dilinizi kullanır, yoksa Türkçe.</div>
    </div>

    <div class="card">
      <h3 class="card-title" data-i18n="cacheTitle">Önbellek</h3>
      <div class="setting-row">
        <span data-i18n="researchData">Araştırma verileri</span>
        <button id="clearCacheBtn" class="btn btn-secondary btn-compact" data-i18n="clear">Temizle</button>
      </div>
    </div>

    <div class="card" id="trackingCard" style="display:none;">
      <h3 class="card-title" data-i18n="trackingTitle">Kargo Takip</h3>
      <div class="setting-row">
        <span data-i18n="pendingTracking">Bekleyen takip no</span>
        <span id="pendingCount" class="status-badge">0</span>
      </div>
      <a id="goToEtsyOrders" href="https://www.etsy.com/your/orders/sold" target="_blank" class="btn btn-secondary full-width" style="margin-top:6px;text-align:center;text-decoration:none;display:block;" data-i18n="goToEtsyOrders">
        Etsy Siparişlerine Git
      </a>
    </div>

    <div class="card" id="addressCard" style="display:none;">
      <h3 class="card-title" data-i18n="addressTitle">Etsy adresleri</h3>
      <div class="setting-row">
        <span id="addressPendingLabel">—</span>
        <span id="addressPendingCount" class="status-badge">0</span>
      </div>
      <button id="importAllAddresses" class="btn btn-primary full-width" style="margin-top:6px;" data-i18n="importAllAddresses">Tüm adresleri içe aktar</button>
      <div id="importAllResult" class="text-muted" style="margin-top:4px;font-size:12px;"></div>
      <button id="openNextAddress" class="btn btn-secondary full-width" style="margin-top:6px;display:none;" data-i18n="openNextOrder">Sıradaki siparişi aç (listede görünmeyenler)</button>
    </div>

    <a href="https://kolayxport.com/app" target="_blank" class="btn btn-primary full-width" style="margin-top:8px;" data-i18n="openApp">
      KolayXport'u Aç
    </a>

    <footer>
      <span class="text-muted" id="versionLabel">v8.0.0</span>
      <span class="sep">·</span>
      <a href="https://kolayxport.com/help/chrome-extension" target="_blank" data-i18n="help">Yardım</a>
    </footer>
  </div>

  <script src="lib/lang.js"></script>
  <script src="lib/limitCard.js"></script>
  <script src="popup.js"></script>
</body>
</html>
