<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KolayXport</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="../icons/icon-32.png" alt="KolayXport" class="logo">
      <h1>KolayXport</h1>
      <span id="authBadge" class="auth-badge checking">●</span>
    </header>

    <div class="card">
      <div class="setting-row">
        <span>Durum</span>
        <span id="authStatus" class="status-badge checking">Kontrol...</span>
      </div>
      <div class="setting-row" id="userRow" style="display:none;">
        <span>Kullanıcı</span>
        <span id="userEmail" class="text-muted">—</span>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">Overlay</h3>
      <div class="setting-row">
        <span>Tüm overlay'ler</span>
        <label class="toggle"><input type="checkbox" id="toggleOverlays" checked><span class="slider"></span></label>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">Önbellek</h3>
      <div class="setting-row">
        <span>Araştırma verileri</span>
        <button id="clearCacheBtn" class="btn btn-secondary btn-compact">Temizle</button>
      </div>
    </div>

    <a href="https://kolayxport.com/app" target="_blank" class="btn btn-primary full-width" style="margin-top:8px;">
      KolayXport'u Aç
    </a>

    <footer>
      <span class="text-muted" id="versionLabel">v7.1.0</span>
      <span class="sep">·</span>
      <a href="https://kolayxport.com/help/chrome-extension" target="_blank">Yardım</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
