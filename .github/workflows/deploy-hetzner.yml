name: Deploy to Hetzner

# Source of truth for the deploy steps: scripts/deploy/hetzner-deploy.sh.
# This workflow just SSHes in and invokes that script. Multi-line YAML in
# appleboy/ssh-action's `script:` field gets collapsed into a single line on
# the remote side, which broke earlier inline if/then/else logic; keeping
# the logic in a real shell script avoids that pitfall entirely.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deploy mode: full (build + restart) or restart (no build)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - restart

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KOLAYXPORT_VPS_IP }}
          username: deploy
          key: ${{ secrets.KOLAYXPORT_SSH_KEY }}
          # Next.js webpack build now runs ~28–30 minutes on this VPS (CPU contention
          # from other tenants on the shared box), so 30m was cutting it off mid-build
          # and failing every deploy. 50m gives real headroom; the atomic swap means a
          # genuine hang still can't take down the live service.
          command_timeout: 50m
          # Push events default to full deploy; workflow_dispatch can pick `restart`.
          script: |
            set -euo pipefail
            MODE="${{ github.event.inputs.mode || 'full' }}"
            cd /home/deploy/kolayxport
            # `git pull` lives in the workflow itself (not the script) so the latest version
            # of scripts/deploy/hetzner-deploy.sh is present on disk before we invoke it.
            # The script will perform any further pulls it considers necessary; idempotent.
            git pull --ff-only origin main
            bash scripts/deploy/hetzner-deploy.sh "$MODE"
