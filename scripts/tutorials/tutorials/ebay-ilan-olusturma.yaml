slug: ebay-ilan-olusturma
order: 15
title: "eBay'de yapay zekâyla yeni ilan oluşturun"
description: "Ürün fotoğrafınızı ekleyin; yapay zekâ başlığı, kategoriyi, ürün özelliklerini, fiyat önerisini ve açıklamayı hazırlasın, ilanı taslak kaydedin."
keyword: "ebay ilan nasıl oluşturulur"
inventoryRefs: [ebay-listing-create, ai-listing-copy, ai-image-gen, staged-drafts-send]
tags: [ebay, ebay ilan oluşturma, yapay zeka, ebay başlık, ebay kategori]
startUrl: /app/ebay-listings/new
ready: { testid: le-ai-fill-run }
reseed: true            # the new listing is saved as a local draft
mocks:
  - use: ebay-create
steps:
  - say: "Merhaba! Bu videoda eBay'de yeni bir ilanı, ürün fotoğrafınızdan yola çıkarak yapay zekâyla oluşturacağız."
  - title: "Ürün fotoğrafınızı ekleyin"
    say: "eBay › Yeni ilan sayfasında önce ürün fotoğrafınızı ekleyin. İlk fotoğraf, ilanın ana fotoğrafı olur."
    do:
      - hover: { role: button, name: "Fotoğraf seçin" }
      - upload: { selector: "input[type=file][accept*='image'] >> nth=0", file: public/demo/iznik-bowl-photo.jpg }
      - waitFor: { selector: "[data-testid=le-section-photos] img" }
      - waitFor: { text: "Fotoğraflardan doldur" }
    zoom: { testid: le-section-photos, scale: 1.3 }
  - title: "Ürününüzü bir cümleyle yazın"
    say: "Hızlı başlayın kartına ürününüzü bir cümleyle yazın. Fotoğrafta görünmeyen bilgileri, örneğin el yapımı olduğunu ve nereden geldiğini, buraya yazın; yapay zekâ yalnızca gördüğünü ve sizin yazdığınızı kullanır."
    do:
      - fill: { selector: "[data-testid=le-ai-fill-seed] input, input[data-testid=le-ai-fill-seed]", value: "Handmade Turkish Iznik ceramic bowl" }
    zoom: { testid: le-ai-fill-card, scale: 1.3 }
  - title: "Fotoğraflardan doldurun"
    say: "Sonra Fotoğraflardan doldur'a tıklayın. Yapay zekâ fotoğrafınıza bakıp ürünü tanır; başlığı, kategoriyi, ürün özelliklerini, fiyatı ve açıklamayı hazırlar."
    do:
      - click: { testid: le-ai-fill-run }
      - waitFor: { testid: le-ai-fill-use-all }
    zoom: { testid: le-ai-fill-card, scale: 1.2 }
  - title: "Başlığa bakın"
    say: "Başlık, alıcıların eBay'de aradığı kelimelerle İngilizce yazılır ve eBay'in seksen karakter sınırına sığar."
    do:
      - scrollTo: { testid: le-ai-fill-proposal-title }
    zoom: { testid: le-ai-fill-proposal-title, scale: 1.3 }
  - title: "Kategori ve ürün özellikleri"
    say: "Kategori, eBay'in kendi kategori önerilerinden seçilir. Ürün özellikleri de o kategorinin eBay'de istediği alanlara göre doldurulur."
    do:
      - scrollTo: { testid: le-ai-fill-proposal-category }
      - scrollTo: { testid: le-ai-fill-proposal-specifics, block: start }
    zoom: { testid: le-ai-fill-proposal-specifics, scale: 1.2 }
  - title: "Fiyat önerisine bakın"
    say: "Fiyat önerisi, eBay'deki benzer ilanların fiyatlarına bakılarak verilir. Son kararı siz verirsiniz."
    do:
      - scrollTo: { testid: le-ai-fill-proposal-price }
    zoom: { testid: le-ai-fill-proposal-price, scale: 1.35 }
  - title: "Açıklamayı okuyun"
    say: "Açıklamayı okuyun. Ürününüze uymayan bir şey varsa öneriyi kullandıktan sonra düzeltebilirsiniz."
    do:
      - scrollTo: { testid: le-ai-fill-proposal-description }
    zoom: { testid: le-ai-fill-proposal-description, scale: 1.25 }
  - title: "Hepsini kullanın"
    say: "Beğendiyseniz Hepsini kullan'a tıklayın. Öneriler alanlara yerleşir; her alanı siz onaylarsınız."
    do:
      - scrollTo: { testid: le-ai-fill-use-all }
      - click: { testid: le-ai-fill-use-all }
      - wait: 800
      - scrollTo: { testid: le-section-title }
    zoom: { testid: le-section-title, scale: 1.25 }
  - title: "Ek fotoğraf oluşturun"
    say: "Fotoğraf oluştur'a tıklayın, sahneyi yazın ve eklediğiniz fotoğrafı referans seçin. Yapay zekâ ürününüzü bu fotoğraftan örnek alır."
    do:
      - scrollTo: { testid: le-section-photos }
      - click: { role: button, name: "Fotoğraf oluştur" }
      - waitFor: { role: dialog }
      - fill: { placeholder: "Örneğin: Beyaz arka planda", value: "The same bowl on a white marble kitchen counter with lemons, bright natural daylight" }
      - click: { selector: "[role=dialog] img >> nth=0" }
      - wait: 500
      - click: { role: button, name: "Görsel Oluştur" }
      - waitFor: { role: button, name: "Listeye Ekle" }
      - scrollTo: { role: button, name: "Listeye Ekle" }
    zoom: { selector: "[role=dialog] img >> nth=-1", scale: 1.25 }
  - title: "Fotoğrafı ilana ekleyin"
    say: "Ürün aynı kalır, yalnızca sahne değişir. Beğendiğinizde Listeye Ekle deyin."
    do:
      - click: { role: button, name: "Listeye Ekle" }
      - waitFor: { selector: "[data-testid=le-section-photos] img >> nth=1" }
    zoom: { testid: le-section-photos, scale: 1.3 }
  - title: "Taslak olarak saklayın"
    say: "İlanınız KolayXport'ta taslak olarak kaydedilir. Kargo ve iade politikalarınızı seçip eBay'de listele diyene kadar eBay'e hiçbir şey gitmez."
    do:
      - hover: { testid: le-primary }
    zoom: { testid: le-footer, scale: 1.4 }
  - say: "Takıldığınız yerde Yardım sayfasından bize yazabilirsiniz. KolayXport'u 14 gün ücretsiz deneyebilirsiniz."
