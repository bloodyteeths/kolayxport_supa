name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip next build (use existing .next on the server)'
        required: false
        default: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KOLAYXPORT_VPS_IP }}
          username: deploy
          key: ${{ secrets.KOLAYXPORT_SSH_KEY }}
          # Next.js build runs ~7–10 minutes on this VPS; the default 10m timeout has killed
          # past deploys mid-build (verified Sprint 5 close). 30m gives us headroom for the
          # build itself plus post-build sitemap generation.
          command_timeout: 30m
          envs: SKIP_BUILD
          script: |
            cd /home/deploy/kolayxport
            SKIP_BUILD="${{ github.event.inputs.skip_build }}"
            git pull origin main
            npm install --legacy-peer-deps
            # Apply any pending Prisma migrations BEFORE generating the client. `migrate deploy`
            # is the only Prisma command allowed in production — it applies migrations from
            # prisma/migrations/* and exits non-zero on failure. NEVER run `prisma db push`
            # or `prisma db push --accept-data-loss` here.
            npx prisma migrate deploy
            npx prisma generate
            if [ "$SKIP_BUILD" = "true" ] && [ -f .next/BUILD_ID ]; then
              echo "Skipping build (skip_build=true). Existing .next has BUILD_ID $(cat .next/BUILD_ID)"
            else
              cp -r .next .next-backup 2>/dev/null || true
              rm -rf .next
              npx next build --webpack || { echo "Build failed, restoring backup"; cp -r .next-backup .next; exit 1; }
            fi
            sudo systemctl restart kolayxport
            sleep 5
            curl -fsS https://kolayxport.com/api/health || { echo "Health check failed, restoring backup"; rm -rf .next; cp -r .next-backup .next; sudo systemctl restart kolayxport; exit 1; }
            rm -rf .next-backup
