<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KolayXport</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <img src="../icons/icon-32.png" alt="KolayXport" class="logo">
      <h1>KolayXport</h1>
      <span id="authBadge" class="auth-badge checking">●</span>
    </header>

    <div class="card">
      <div class="setting-row">
        <span data-i18n="status">Status</span>
        <span id="authStatus" class="status-badge checking" data-i18n="checking">Checking...</span>
      </div>
      <div class="setting-row" id="userRow" style="display:none;">
        <span data-i18n="user">User</span>
        <span id="userEmail" class="text-muted">—</span>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title" data-i18n="overlayTitle">Overlay</h3>
      <div class="setting-row">
        <span data-i18n="allOverlays">All overlays</span>
        <label class="toggle"><input type="checkbox" id="toggleOverlays" checked><span class="slider"></span></label>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title" data-i18n="cacheTitle">Cache</h3>
      <div class="setting-row">
        <span data-i18n="researchData">Research data</span>
        <button id="clearCacheBtn" class="btn btn-secondary btn-compact" data-i18n="clear">Clear</button>
      </div>
    </div>

    <div class="card" id="trackingCard" style="display:none;">
      <h3 class="card-title" data-i18n="trackingTitle">Tracking Push</h3>
      <div class="setting-row">
        <span data-i18n="pendingTracking">Pending tracking</span>
        <span id="pendingCount" class="status-badge">0</span>
      </div>
      <a id="goToEtsyOrders" href="https://www.etsy.com/your/orders/sold" target="_blank" class="btn btn-secondary full-width" style="margin-top:6px;text-align:center;text-decoration:none;display:block;" data-i18n="goToEtsyOrders">
        Go to Etsy Orders
      </a>
    </div>

    <a href="https://kolayxport.com/app" target="_blank" class="btn btn-primary full-width" style="margin-top:8px;" data-i18n="openApp">
      Open KolayXport
    </a>

    <footer>
      <span class="text-muted" id="versionLabel">v8.0.0</span>
      <span class="sep">·</span>
      <a href="https://kolayxport.com/help/chrome-extension" target="_blank" data-i18n="help">Help</a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
