name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KOLAYXPORT_VPS_IP }}
          username: deploy
          key: ${{ secrets.KOLAYXPORT_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/deploy/kolayxport
            git pull origin main
            npm install --legacy-peer-deps
            npx prisma generate
            npm run build
            sudo systemctl restart kolayxport
