name: Deploy to Hetzner

# Source of truth for the deploy steps: scripts/deploy/hetzner-deploy.sh.
# This workflow just SSHes in and invokes that script. Multi-line YAML in
# appleboy/ssh-action's `script:` field gets collapsed into a single line on
# the remote side, which broke earlier inline if/then/else logic; keeping
# the logic in a real shell script avoids that pitfall entirely.

# Deploys run on the VPS itself (cron → scripts/deploy/autodeploy.sh, every 2 minutes): pushing to main no longer
# spends GitHub Actions minutes. This workflow is a manual button only (e.g. a restart-only deploy).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deploy mode: full (build + restart) or restart (no build)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - restart

# Deploys share one working tree on the VPS: never run two at once.
# A newer push queues behind the running deploy instead of racing it.
concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.KOLAYXPORT_VPS_IP }}
          username: deploy
          key: ${{ secrets.KOLAYXPORT_SSH_KEY }}
          # The webpack build competes with other tenants on this 8 GB box and swaps
          # heavily; since the design-system milestones it runs past 50 minutes and was
          # killed mid-build (fa4755b, 57048f3). 110m gives headroom until the build
          # moves to CI; the atomic .next swap means a hang still can't take down the
          # live service.
          command_timeout: 110m
          # Push events default to full deploy; workflow_dispatch can pick `restart`.
          script: |
            set -euo pipefail
            MODE="${{ github.event.inputs.mode || 'full' }}"
            cd /home/deploy/kolayxport
            # `git pull` lives in the workflow itself (not the script) so the latest version
            # of scripts/deploy/hetzner-deploy.sh is present on disk before we invoke it.
            # The script will perform any further pulls it considers necessary; idempotent.
            # npm install rewrites yarn.lock on the server; it is a generated file, not local
            # work, so restore it before pulling or a lockfile change on main blocks the pull.
            git checkout -- yarn.lock 2>/dev/null || true
            git pull --ff-only origin main
            FORCE=1 bash /home/deploy/bin/kx-autodeploy.sh "$MODE"
