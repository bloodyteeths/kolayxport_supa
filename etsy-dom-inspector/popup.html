<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .btn {
      display: inline-block;
      padding: 8px 16px;
      background: #1976d2;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }
    .btn:hover {
      background: #1565c0;
    }
    .btn-secondary {
      background: #757575;
    }
    .btn-secondary:hover {
      background: #616161;
    }
    .results {
      max-height: 300px;
      overflow-y: auto;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 12px;
    }
    .finding {
      margin-bottom: 10px;
      padding: 8px;
      background: white;
      border-radius: 4px;
      border-left: 3px solid #1976d2;
    }
    .finding h4 {
      margin: 0 0 5px 0;
      color: #1976d2;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>🔍 Etsy DOM Inspector</h3>
    <p>Discovers actual DOM structure for order scraping</p>
  </div>

  <div class="actions">
    <button id="inspectBtn" class="btn">🔍 Inspect DOM</button>
    <button id="logsBtn" class="btn btn-secondary">📋 View Logs</button>
  </div>

  <div id="results" class="results" style="display: none;">
    <!-- Results will be populated here -->
  </div>

  <script src="popup-inspector.js"></script>
</body>
</html>
