# New Etsy listing (/app/etsy-listings/new) with the editor's AI — "etsy-ilan-olusturma" tutorial.
# Every AI answer here is a REAL answer of our own server (the same /api/ai/* and /api/clawd/ebay-ai code the app
# runs, billed Gemini key), captured once:
#   TUTORIAL_CAPTURE=1 TUTORIAL_DRY=1 DEMO_PASSWORD=… node scripts/tutorials/record.mjs etsy-ilan-olusturma
# and replayed in every recording. Use with `etsy-editor` (shop sections, shipping profiles, taxonomy, market search).
# Nothing reaches Etsy: the safety rules in mocks.mjs refuse every Etsy / eBay write and every draft send.
# "Fotoğraflardan doldur": identify the product from the photo, then title → description → tags.
- { url: "**/api/clawd/ebay-ai?**", method: POST, query: { action: identify_product }, fixture: ai-identify-product.json, capture: true }
- { url: "**/api/ai/etsy**", body: { action: optimize_title }, fixture: ai-optimize-title.json, capture: true }
- { url: "**/api/ai/etsy**", body: { action: generate_description }, fixture: ai-generate-description.json, capture: true }
- { url: "**/api/ai/etsy**", body: { action: suggest_tags }, fixture: ai-suggest-tags.json, capture: true }
- { url: "**/api/ai/etsy**", body: { action: generate_alt_text }, fixture: ai-generate-alt-text.json, capture: true }
# "Fotoğraf oluştur" with the staged photo as the reference (the image lands next to the fixture).
- { url: "**/api/ai/generate-image**", method: POST, fixture: generate-image.json, capture: true }
