name: Scheduled Cron Jobs

# Verified production cron source for /api/cron/sync-orders.
# Frontend/API is served by Hetzner at https://kolayxport.com (see KOLAYXPORT_PRODUCTION_TOPOLOGY.md).
# Required repository secrets:
#   - KOLAYXPORT_BASE_URL  (e.g. https://kolayxport.com)
#   - CRON_SECRET          (Bearer token expected by the API handler)
#
# This workflow fails loudly if either secret is missing or the endpoint returns non-2xx.
# Idempotency is enforced server-side via lib/cron/idempotency.ts and the CronLock model,
# so double-fires from manual workflow_dispatch (or Vercel cron) are safe.

on:
  schedule:
    - cron: '*/15 * * * *'
    # Etsy webhook queue sweeper (safety net; self-skips while the in-process worker is healthy)
    - cron: '*/2 * * * *'
    # Scheduler fallback: runs any due JobRun-scheduled job the in-process scheduler missed
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (sync-orders | process-etsy-webhooks | run-due)'
        required: false
        default: 'sync-orders'

jobs:
  sync-orders:
    if: github.event.schedule == '*/15 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'sync-orders')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger order sync
        env:
          KOLAYXPORT_BASE_URL: ${{ secrets.KOLAYXPORT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${KOLAYXPORT_BASE_URL:-}" ]; then
            echo "::error::Missing required secret KOLAYXPORT_BASE_URL"
            exit 1
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing required secret CRON_SECRET"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${KOLAYXPORT_BASE_URL}/api/cron/sync-orders"

  process-etsy-webhooks:
    if: github.event.schedule == '*/2 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'process-etsy-webhooks')
    runs-on: ubuntu-latest
    steps:
      - name: Sweep Etsy webhook queue
        env:
          KOLAYXPORT_BASE_URL: ${{ secrets.KOLAYXPORT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${KOLAYXPORT_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing required secret KOLAYXPORT_BASE_URL or CRON_SECRET"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 110 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${KOLAYXPORT_BASE_URL}/api/cron/process-etsy-webhooks"

  run-due:
    if: github.event.schedule == '7,22,37,52 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.job == 'run-due')
    runs-on: ubuntu-latest
    steps:
      - name: Run due scheduler jobs
        env:
          KOLAYXPORT_BASE_URL: ${{ secrets.KOLAYXPORT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${KOLAYXPORT_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing required secret KOLAYXPORT_BASE_URL or CRON_SECRET"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${KOLAYXPORT_BASE_URL}/api/cron/run-job?due=1"
